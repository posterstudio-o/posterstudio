<link rel="canonical" href="https://posterstudioo.netlify.app/services.html"><title>PosterStudio — Creative Design Services</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f9f8;color:#101828}.container{max-width:1050px;margin:auto;padding:22px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.logo{font-size:24px;font-weight:900}.logo span{color:#16803a}.home{padding:10px 16px;background:#111;color:#fff;border-radius:10px;text-decoration:none}h1{font-size:42px;margin:0 0 10px}.intro{color:#667085;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.card,.orderbox{background:#fff;border:1px solid #e7ebe8;border-radius:20px;padding:22px}.card:hover{transform:translateY(-5px);box-shadow:0 15px 35px #0001}.icon{font-size:30px}.card p{color:#667085;line-height:1.55;min-height:55px}.orderbox{max-width:700px;margin:35px auto}.orderbox label{display:block;font-weight:800;margin:13px 0 6px}.orderbox input,.orderbox select,.orderbox textarea{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:11px;font:inherit}.orderbox textarea{min-height:110px}.wa{margin-top:16px;width:100%;padding:14px;border:0;border-radius:12px;background:#16803a;color:#fff;font-weight:900;font-size:16px}@media(max-width:750px){.grid{grid-template-columns:1fr}h1{font-size:35px}}
</style></head><body><div class="container"><div class="top"><div class="logo" id="logo">PosterStudio</div><a class="home" href="index.html">← Home</a></div><h1>Professional Design Services</h1><p class="intro">Choose a service and send your requirements directly on WhatsApp.</p><div class="grid" id="services"></div><div class="orderbox" id="order"><h2>📲 Place Your Order</h2><label>Your Name</label><input id="name" placeholder="Enter your name"><label>Service</label><select id="service"></select><label>Requirements</label><textarea id="req" placeholder="Tell us what you need..."></textarea><label>Reference / Photo</label><input id="ref" placeholder="I will send the photo/reference on WhatsApp"><label>Required Date</label><input id="date" type="date"><button class="wa" id="send">Send Order on WhatsApp →</button></div></div><script>
const sb=supabase.createClient('https://obhhrkvdygbgozomkebs.supabase.co','sb_publishable__2eqk9u6MYspKuJzhPbbFQ_sRC2wuXu');let WA='919744476987';
async function init(){const st=await sb.from('site_settings').select('brand,wa,services').limit(1).maybeSingle();if(st.data){WA=(st.data.wa||WA).replace(/\D/g,'');document.getElementById('logo').textContent=st.data.brand||'PosterStudio';const raw=st.data.services;const a=Array.isArray(raw)?raw:(raw&&raw.services)||[];document.getElementById('services').innerHTML=a.map(x=>`<div class="card"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('');document.getElementById('service').innerHTML=a.map(x=>`<option>${x[1]}</option>`).join('')}const q=new URLSearchParams(location.search).get('plan');if(q){document.getElementById('req').value='I am interested in the '+q+' plan.'}}
init();document.getElementById('send').onclick=()=>{const n=document.getElementById('name').value.trim(),sv=document.getElementById('service').value,req=document.getElementById('req').value.trim(),ref=document.getElementById('ref').value.trim(),d=document.getElementById('date').value;if(!n||!req){alert('Please enter your name and requirements.');return}const msg=`Hello PosterStudio,\n\nI want to place an order.\n\nName: ${n}\nService: ${sv}\nRequirements: ${req}\nReference/Photo: ${ref||'I will send it on WhatsApp'}\nRequired Date: ${d||'Not specified'}`;location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg)};
</script></body></html>
