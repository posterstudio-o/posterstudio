<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="robots" content="index,follow"><title>PosterStudio — Personalized Poster Maker</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8f6;color:#101828}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:24px;font-weight:900}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.dark{background:#101828;color:#fff}.green{background:#16803a;color:#fff}.card{background:#fff;border:1px solid #e4e7ec;border-radius:20px;padding:18px;box-shadow:0 10px 30px #1018280d}.grid{display:grid;grid-template-columns:390px 1fr;gap:20px}.field{margin:16px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:11px;font:inherit}.cropbox{margin-top:10px;background:#f8fafc;border:1px solid #eaecf0;border-radius:14px;padding:10px}.cropframe{position:relative;width:100%;max-width:330px;margin:auto;overflow:hidden;background:#111;border:2px solid #16803a;border-radius:12px;touch-action:none;user-select:none}.cropframe img{position:absolute;max-width:none;transform-origin:center center;pointer-events:none}.cropframe{mask-repeat:no-repeat;-webkit-mask-repeat:no-repeat;mask-size:100% 100%;-webkit-mask-size:100% 100%}.cropcontrols{display:flex;align-items:center;gap:8px;margin-top:9px}.cropcontrols input{flex:1}.cropactions{display:flex;gap:8px;margin-top:9px}.cropactions .btn{flex:1}.crophint{font-size:12px;color:#667085;margin-top:7px;text-align:center}.cropok{font-size:13px;color:#16803a;font-weight:800;margin-top:7px;text-align:center}.preview{display:flex;justify-content:center;align-items:center;min-height:520px;background:#eef2ef;border-radius:16px;padding:12px}.preview canvas{max-width:100%;height:auto;box-shadow:0 12px 35px #10182822}.row{display:flex;gap:10px;flex-wrap:wrap}.status{font-weight:800;margin:12px 0;color:#16803a}.small{font-size:13px;color:#667085}.hidden{display:none}.note{background:#f8fafc;border-radius:12px;padding:12px;color:#475467;font-size:13px}.ready{background:#ecfdf3;border:1px solid #abefc6;color:#067647;border-radius:12px;padding:10px;font-weight:800;margin-top:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.preview{min-height:0}.preview canvas{width:100%}}
</style></head><body><div class="wrap"><div class="top"><div class="logo">PosterStudio</div><a class="btn dark" href="index.html">Home</a></div>
<div id="app" class="hidden"><div class="grid"><div class="card"><h2>Poster Maker</h2><div id="directNote" class="note hidden"></div><div id="templateChooser" class="field"><label>Template</label><select id="template"></select></div><div id="fields"></div><div class="row"><button class="btn green" id="generate" disabled>Generate Poster</button><button class="btn dark" id="download" disabled>HD PNG</button><button class="btn green" id="share" disabled>WhatsApp Share</button></div><div class="note" style="margin-top:14px">Select a clear portrait photo → face is centered automatically → make a small Drag/Zoom adjustment if needed → tap <b>Crop</b> → Generate Poster.</div><div id="status" class="status">Loading...</div></div><div class="card"><h2>Poster Preview</h2><div class="preview"><canvas id="canvas" width="1240" height="1240"></canvas></div></div></div></div>
<script>
const sb=supabase.createClient('https://obhhrkvdygbgozomkebs.supabase.co','sb_publishable__2eqk9u6MYspKuJzhPbbFQ_sRC2wuXu');
let templates=[],photos={},values={},current=null,settings=null,crop={},cropped={};
const app=document.getElementById('app'),statusEl=document.getElementById('status'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const params=new URLSearchParams(location.search);const directId=params.get('template')||params.get('t');
function normalize(v){if(Array.isArray(v))return{services:v,templates:[]};if(v&&typeof v==='object')return{services:Array.isArray(v.services)?v.services:[],templates:Array.isArray(v.templates)?v.templates:[]};return{services:[],templates:[]}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getFields(t){if(Array.isArray(t?.fields)&&t.fields.length)return t.fields;return[{id:'photo1',type:'photo',label:'Photo',x:+t.photo_x||616,y:+t.photo_y||579,w:+t.photo_w||526,h:+t.photo_h||661,radius:30},{id:'text1',type:'text',label:'Name',x:+t.name_x||166,y:+t.name_y||1150,w:500,h:100,font:+t.name_font||52,color:t.name_color||'#111111',align:'left'}]}
function photoFields(){return getFields(current).filter(f=>f.type==='photo')}
function requiredReady(){const pf=photoFields();return pf.length>0&&pf.every(f=>photos[f.id]&&cropped[f.id])}
function updateButtons(){const ok=requiredReady();['generate','download','share'].forEach(id=>document.getElementById(id).disabled=!ok);if(ok)statusEl.textContent='Ready ✓'}
async function loadTemplates(){statusEl.textContent='Loading templates...';const r=await sb.from('site_settings').select('wa,services').limit(1).maybeSingle();if(r.error){statusEl.textContent='Could not load templates: '+r.error.message;return}settings=r.data||{};const st=normalize(settings.services);templates=(st.templates||[]).filter(t=>t.active);if(directId){const t=templates.find(x=>String(x.id)===String(directId));if(!t){statusEl.textContent='This template link is not available.';return}current=t;document.getElementById('templateChooser').classList.add('hidden');document.getElementById('directNote').classList.remove('hidden');document.getElementById('directNote').innerHTML='<b>'+escapeHtml(t.name)+'</b><br>Personalized template';renderFields();await loadBgAndDraw();return}const sel=document.getElementById('template');sel.innerHTML=templates.length?templates.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join(''):'<option value="">No active templates</option>';if(templates.length){sel.onchange=async()=>{current=templates.find(x=>String(x.id)===sel.value);photos={};values={};crop={};cropped={};renderFields();await loadBgAndDraw();updateButtons()};current=templates[0];renderFields();await loadBgAndDraw()}statusEl.textContent=templates.length?'Select and crop your photo.':'Admin has not uploaded a template yet.'}
function cropDefaults(f,im){const w=+f.w||300,h=+f.h||400;const base=Math.max(w/im.width,h/im.height);return{zoom:1,px:0,py:0,base,auto:false,face:null}}
let faceDetectorPromise=null,photoMaskCache=new Map();
async function getFaceDetector(){
  if(faceDetectorPromise)return faceDetectorPromise;
  faceDetectorPromise=(async()=>{
    const mod=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const vision=await mod.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    return await mod.FaceDetector.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite'},runningMode:'IMAGE',minDetectionConfidence:0.5});
  })().catch(e=>{faceDetectorPromise=null;throw e});
  return faceDetectorPromise;
}
function clampCrop(c,w,h,im){const s=c.base*(c.zoom||1),sw=im.width*s,sh=im.height*s;c.px=Math.min(0,Math.max(w-sw,c.px||0));c.py=Math.min(0,Math.max(h-sh,c.py||0));}
async function autoFaceCrop(f,im){
  const w=+f.w||300,h=+f.h||400,c=crop[f.id]||cropDefaults(f,im);
  try{
    const detector=await getFaceDetector();
    const result=detector.detect(im);
    const ds=result?.detections||[];
    if(!ds.length)throw new Error('No face detected');
    const best=ds.slice().sort((a,b)=>(b.boundingBox.width*b.boundingBox.height)-(a.boundingBox.width*a.boundingBox.height))[0];
    const b=best.boundingBox;
    const fx=+b.originX||+b.x||0,fy=+b.originY||+b.y||0,fw=+b.width||0,fh=+b.height||0;
    if(!fw||!fh)throw new Error('Invalid face box');
    const targetFaceH=h*(+f.face_ratio||0.38);
    c.zoom=Math.max(1,Math.min(3,targetFaceH/(fh*c.base)));
    const s=c.base*c.zoom,sw=im.width*s,sh=im.height*s;
    const targetX=w/2,targetY=h*(+f.face_y||0.42);
    c.px=targetX-(fx+fw/2)*s-(w-sw)/2;
    c.py=targetY-(fy+fh/2)*s-(h-sh)/2;
    clampCrop(c,w,h,im);c.auto=true;c.face={x:fx,y:fy,w:fw,h:fh};crop[f.id]=c;
    return true;
  }catch(e){c.auto=false;crop[f.id]=c;return false}
}
function getPhotoMask(f){
  if(!current?._img)return null;
  const key=String(current.id)+'|'+f.id+'|'+(+f.x||0)+','+(+f.y||0)+','+(+f.w||0)+','+(+f.h||0);
  if(photoMaskCache.has(key))return photoMaskCache.get(key);
  const x=Math.max(0,Math.floor(+f.x||0)),y=Math.max(0,Math.floor(+f.y||0)),w=Math.max(1,Math.floor(+f.w||300)),h=Math.max(1,Math.floor(+f.h||400));
  const tc=document.createElement('canvas');tc.width=1240;tc.height=1240;const tx=tc.getContext('2d',{willReadFrequently:true});tx.drawImage(current._img,0,0,1240,1240);
  let data;try{data=tx.getImageData(x,y,w,h)}catch(e){photoMaskCache.set(key,null);return null}
  let transparent=0;for(let i=3;i<data.data.length;i+=4){if(data.data[i]<245)transparent++}
  const ratio=transparent/(w*h);
  if(ratio<0.05){photoMaskCache.set(key,null);return null}
  const mc=document.createElement('canvas');mc.width=w;mc.height=h;const md=mc.getContext('2d').createImageData(w,h);
  for(let i=0,j=3;i<data.data.length;i+=4,j+=4){const a=data.data[j];md.data[j]=Math.max(0,255-a);md.data[i]=255;md.data[i+1]=255;md.data[i+2]=255}
  mc.getContext('2d').putImageData(md,0,0);photoMaskCache.set(key,mc);return mc;
}
function applyFrameMask(frame,f){
  const m=getPhotoMask(f);
  if(!m){frame.style.maskImage='';frame.style.webkitMaskImage='';frame.style.borderRadius=Math.min(f.radius||30,Math.min(+f.w||300,+f.h||400)/8)+'px';return}
  frame.style.borderRadius='0';const url='url("'+m.toDataURL('image/png')+'")';frame.style.maskImage=url;frame.style.webkitMaskImage=url;frame.style.maskSize='100% 100%';frame.style.webkitMaskSize='100% 100%';frame.style.maskRepeat='no-repeat';frame.style.webkitMaskRepeat='no-repeat';
}

function cropUI(f,im){
  const id=f.id;crop[id]=crop[id]||cropDefaults(f,im);const c=crop[id],w=+f.w||300,h=+f.h||400;
  const wrap=document.createElement('div');wrap.className='cropbox';
  const frame=document.createElement('div');frame.className='cropframe';frame.style.aspectRatio=w+'/'+h;
  const pv=document.createElement('canvas');pv.width=Math.max(1,Math.round(w));pv.height=Math.max(1,Math.round(h));frame.appendChild(pv);const pctx=pv.getContext('2d');
  const mask=getPhotoMask(f);
  const controls=document.createElement('div');controls.className='cropcontrols';controls.innerHTML='<span>Zoom</span><input type="range" min="1" max="3" step="0.01" value="'+c.zoom+'"><b>'+c.zoom.toFixed(2)+'×</b>';
  const actions=document.createElement('div');actions.className='cropactions';const cropBtn=document.createElement('button');cropBtn.className='btn green';cropBtn.textContent=cropped[id]?'✓ Cropped':'Crop';const resetBtn=document.createElement('button');resetBtn.className='btn dark';resetBtn.textContent='Reset';actions.append(cropBtn,resetBtn);
  const hint=document.createElement('div');hint.className='crophint';hint.textContent='✨ Face is auto-centered. Drag or Zoom only if you want a small adjustment.';
  const ok=document.createElement('div');ok.className='cropok';ok.textContent=cropped[id]?'✓ Photo is ready':'Adjust the photo, then tap Crop';wrap.append(frame,controls,actions,hint,ok);
  const render=()=>{
    const s=c.base*(c.zoom||1),sw=im.width*s,sh=im.height*s,dx=(w-sw)/2+(c.px||0),dy=(h-sh)/2+(c.py||0);
    pctx.clearRect(0,0,w,h);pctx.fillStyle='#111';pctx.fillRect(0,0,w,h);
    if(mask){
      const pc=document.createElement('canvas');pc.width=Math.ceil(w);pc.height=Math.ceil(h);const q=pc.getContext('2d');q.drawImage(im,dx,dy,sw,sh);q.globalCompositeOperation='destination-in';q.drawImage(mask,0,0,w,h);pctx.drawImage(pc,0,0);
    }else{pctx.save();roundedClipPreview(pctx,0,0,w,h,Math.min(f.radius||30,Math.min(w,h)/8));pctx.clip();pctx.drawImage(im,dx,dy,sw,sh);pctx.restore()}
    pctx.save();pctx.strokeStyle='#16803a';pctx.lineWidth=Math.max(3,Math.min(w,h)*.012);pctx.strokeRect(pctx.lineWidth/2,pctx.lineWidth/2,w-pctx.lineWidth,h-pctx.lineWidth);pctx.restore();
    controls.querySelector('b').textContent=c.zoom.toFixed(2)+'×';
  };requestAnimationFrame(render);
  controls.querySelector('input').oninput=e=>{c.zoom=+e.target.value;clampCrop(c,w,h,im);render();draw();cropped[id]=false;ok.textContent='Adjust the photo, then tap Crop';cropBtn.textContent='Crop';updateButtons()};
  let sx=0,sy=0,spx=0,spy=0,drag=false;const down=e=>{drag=true;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;spx=c.px;spy=c.py;e.preventDefault()};const move=e=>{if(!drag)return;const p=e.touches?e.touches[0]:e;const rect=pv.getBoundingClientRect();const scale=rect.width/w;c.px=spx+(p.clientX-sx)/scale;c.py=spy+(p.clientY-sy)/scale;clampCrop(c,w,h,im);render();draw();cropped[id]=false;ok.textContent='Adjust the photo, then tap Crop';cropBtn.textContent='Crop';updateButtons();e.preventDefault()};const up=()=>drag=false;frame.addEventListener('pointerdown',down);window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',up);
  cropBtn.onclick=()=>{cropped[id]=true;ok.textContent='✓ Photo is ready';cropBtn.textContent='✓ Cropped';draw();updateButtons()};
  resetBtn.onclick=()=>{crop[id]=cropDefaults(f,im);cropped[id]=false;controls.querySelector('input').value=1;render();draw();ok.textContent='Adjust the photo, then tap Crop';cropBtn.textContent='Crop';updateButtons()};return wrap
}
function roundedClipPreview(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function renderFields(){const box=document.getElementById('fields');if(!current){box.innerHTML='';return}box.innerHTML='';getFields(current).forEach(f=>{const row=document.createElement('div');row.className='field';const label=document.createElement('label');label.textContent=f.label||(f.type==='photo'?'Photo':'Text');row.appendChild(label);if(f.type==='photo'){const el=document.createElement('input');el.id='f_'+f.id;el.type='file';el.accept='image/*';row.appendChild(el);const holder=document.createElement('div');holder.id='holder_'+f.id;row.appendChild(holder);el.onchange=e=>{const file=e.target.files?.[0];if(!file)return;const rd=new FileReader();rd.onload=ev=>{const im=new Image();im.onload=async()=>{photos[f.id]=im;crop[f.id]=cropDefaults(f,im);cropped[f.id]=false;holder.innerHTML='';const loading=document.createElement('div');loading.className='crophint';loading.textContent='✨ Detecting face and fitting photo...';holder.appendChild(loading);draw();statusEl.textContent='Detecting face...';const ok=await autoFaceCrop(f,im);holder.innerHTML='';holder.appendChild(cropUI(f,im));draw();statusEl.textContent=ok?'✨ Face centered automatically. Tap Crop or adjust if needed.':'Face not detected — photo is centered. You can adjust manually.';updateButtons()};im.src=ev.target.result};rd.readAsDataURL(file)};if(photos[f.id])holder.appendChild(cropUI(f,photos[f.id]))}else{const el=document.createElement('input');el.id='f_'+f.id;el.type='text';el.placeholder='Enter '+(f.label||'text');el.value=values[f.id]||'';el.oninput=()=>{values[f.id]=el.value;draw()};row.appendChild(el)}box.appendChild(row)})}
function loadBgAndDraw(){if(!current)return;const im=new Image();im.onload=()=>{current._img=im;photoMaskCache.clear();draw()};im.src=current.image_url}
function roundedClip(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){ctx.clearRect(0,0,1240,1240);if(!current||!current._img)return;const fields=getFields(current);fields.forEach(f=>{if(f.type==='photo'&&photos[f.id]){const im=photos[f.id],x=+f.x||0,y=+f.y||0,w=+f.w||300,h=+f.h||400,c=crop[f.id]||cropDefaults(f,im),s=c.base*(c.zoom||1),sw=im.width*s,sh=im.height*s,dx=x+(w-sw)/2+(c.px||0),dy=y+(h-sh)/2+(c.py||0),mask=getPhotoMask(f);if(mask){const pc=document.createElement('canvas');pc.width=Math.ceil(w);pc.height=Math.ceil(h);const pctx=pc.getContext('2d');pctx.drawImage(im,dx-x,dy-y,sw,sh);pctx.globalCompositeOperation='destination-in';pctx.drawImage(mask,0,0,w,h);ctx.drawImage(pc,x,y)}else{ctx.save();roundedClip(x,y,w,h,Math.min(f.radius||30,Math.min(w,h)/8));ctx.clip();ctx.drawImage(im,dx,dy,sw,sh);ctx.restore()}}});ctx.drawImage(current._img,0,0,1240,1240);fields.forEach(f=>{if(f.type==='text'){const txt=values[f.id]||'',x=+f.x||0,y=+f.y||0,w=+f.w||300,h=+f.h||100,align=f.align||'left',anchorX=align==='center'?x+w/2:align==='right'?x+w:x;ctx.save();ctx.fillStyle=f.color||'#111';ctx.font=`${+f.font||52}px Arial,sans-serif`;ctx.textBaseline='middle';ctx.textAlign=align;if(txt)ctx.fillText(txt,anchorX,y+h/2);ctx.restore()}})}
document.getElementById('generate').onclick=()=>{if(!requiredReady()){statusEl.textContent='Please crop the photo first.';return}draw();statusEl.textContent='Poster generated ✓'};
document.getElementById('download').onclick=()=>{if(!requiredReady())return;draw();const a=document.createElement('a');a.download='personalized-poster.png';a.href=canvas.toDataURL('image/png');a.click()};
function templateLink(){return location.origin+location.pathname+'?template='+encodeURIComponent(current.id)}function tShareText(t){return(t&&((t.share_text||t.program_text||t.program||t.title)||'')).trim()}
async function sharePoster(){if(!requiredReady()){statusEl.textContent='Please crop the photo first.';return}draw();canvas.toBlob(async blob=>{if(!blob)return;const file=new File([blob],'personalized-poster.png',{type:'image/png'});const link=templateLink(),program=tShareText(current)||'Create your own poster here:',msg=`${program}\n${link}`;if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({title:'My Poster',text:msg,files:[file]});statusEl.textContent='Share sheet opened ✓';return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.download=file.name;a.href=URL.createObjectURL(blob);a.click();const wa=(settings?.wa||'919744476987').replace(/\D/g,'');window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank');statusEl.textContent='Poster downloaded and WhatsApp link opened.'},'image/png')}
document.getElementById('share').onclick=sharePoster;async function boot(){app.classList.remove('hidden');await loadTemplates()}boot();
</script></body></html>
